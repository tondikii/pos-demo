name: CI
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bunx turbo run build --filter=@larispos/shared --filter=@larispos/db --filter=@larispos/backend 2>&1 | tail -50
      - run: bunx tsc --noEmit --project packages/shared/tsconfig.json
      - run: bunx tsc --noEmit --project packages/db/tsconfig.json
      - run: bunx tsc --noEmit --project apps/backend/tsconfig.json
      - run: bun run db:generate --dry-run 2>&1 | tail -20
        working-directory: packages/db
        continue-on-error: true
